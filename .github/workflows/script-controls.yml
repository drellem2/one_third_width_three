name: Script controls

# Runs the fast, self-contained controls that guard the delta engine.
#
# WHY THE PATH FILTER IS WIDE (mg-4ad1): the only workflow in this repo used to
# be lean.yml, which filters on `lean/**`.  The last commit touching `lean/` was
# 2026-05-21, so from that date every commit -- all of them under `docs/`,
# `data/` and `scripts/` -- shipped with no automated coverage of any kind.  The
# mg-8489 gate control was in that window: present, correct, and never invoked.
# A control nothing runs is indistinguishable from a control that does not
# exist, so the filter here names the directories this repo actually commits to.
#
# WHAT MAY GO IN HERE: fast (order-seconds), self-contained, self-verifying
# scripts that already exit non-zero on failure.  The searches and the width-4
# arena counter must NOT be added -- the arena count alone is ~430 s at n = 10
# and the sweeps are far longer.  If a script has no fast self-check mode, leave
# it out rather than inventing one.

on:
  push:
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'docs/**'
      - '.github/workflows/script-controls.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'docs/**'
      - '.github/workflows/script-controls.yml'
  workflow_dispatch:

jobs:
  controls:
    runs-on: ubuntu-latest
    # PUT BACK TO 10 BY mg-75f0, whose reasoning the 10 -> 20 raise was carried
    # on.  mg-7db4 landed that raise here to avoid a conflict on this file and
    # was right to; the reasoning behind it was wrong, and correcting it is
    # mg-75f0's to do rather than mg-7db4's to inherit.
    #
    # The raise assumed the mg-5ad1 probe was expensive, on a 2m33s reading taken
    # while a multi-gate mutation demonstration was saturating the same host
    # (mg-1b8c: concurrent heavy jobs here inflate each other by roughly 10x).
    # Uncontended, measured on the fleet host: the probe is 26.5 s and the
    # mg-2c34 gate is 45 s; mg-7db4 measured this whole workflow going 41-64 s ->
    # 1m12s with both new steps on a hosted runner.  10 minutes was never close
    # to tight, and a bound loosened on a bad measurement is worse than one left
    # alone -- it stops being a wedge detector, which is the only thing a
    # timeout on an order-seconds job is for.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python version
        run: python3 --version

      # mg-3934, STATIC HALF ONLY, and the flag is the point.  This job's
      # checkout is depth 1 -- `actions/checkout`'s default, deliberate here,
      # and correct as long as nothing this job runs reads history.  That
      # condition is what `--static-only` checks: it derives the scripts each
      # workflow executes, their import closure, and which of those read a
      # pinned historical revision, then fails any workflow that reads one
      # without `fetch-depth: 0`.  It resolves nothing, so it is sound in a
      # shallow checkout; the resolvability half runs in gate-mutation-demo.yml,
      # where the history is actually fetched.
      #
      # It runs on EVERY commit under scripts/, data/ or docs/, and that is the
      # reason it is here and not only in the paths-filtered job: the defect it
      # is for -- mg-75f0's class-closure demo dead on arrival in CI for 21
      # hours because af7fc2df is not in a depth-1 clone -- was found by a red
      # run, and a second instance in a step that runs later would have been
      # just as invisible.  Order-milliseconds, standard library only,
      # self-testing (seven synthetic drifts, each of which must fire).
      - name: 'mg-3934 CI history-depth control (static half)'
        run: python3 scripts/onethird_mg3934_ci_history_depth_control.py --static-only

      # mg-8489: negative control for the fast_Q engine gate.  Corrupts fast_Q
      # three ways and Q_primary once, and requires five_engine_check to RAISE
      # on each; also requires it to stay green before and after patching.
      # ~1 s.  Exits non-zero if any of the 6 rows behaves wrongly.
      - name: 'mg-8489 fast_Q gate control (can the engine gate fail?)'
        run: python3 scripts/onethird_mg8489_fastq_gate_control.py

      # mg-8ff1: the n=9 witness that Lemma 3.2b's boxed "maps" hypothesis is
      # strictly weaker than the "swaps" its proof needs.  Re-derives |Aut(P)|,
      # e(P) and delta(P) rather than asserting them, so it also exercises
      # delta_of from the primitive delta search.  ~1 s.
      - name: 'mg-8ff1 Lemma 3.2b counterexample (n=9 witness)'
        run: python3 scripts/onethird_mg8ff1_lemma32b_counterexample.py

      # mg-2c34: the SD-quant overlap instrument and its four controls.  The
      # `--no-sweep` mode skips the 946-poset population sweep and runs only
      # the parts that can fail: CONTROL A (the instrument must reproduce a
      # known c = cos^2(theta), INCLUDING c = 0 -- an instrument that cannot
      # output 0 cannot refute SD-quant), CONTROL B/C (antichain c_max = c_min
      # = 1, and a deliberately broken projector must NOT return 1), CHECK-0
      # (agreement with mg-4a86's own instrument), and the identity check that
      # the three named posets still match their committed mg-8b64 rows.
      #
      # REPAIRED after the mg-09ea audit (mg-60d3): two mutations used to pass
      # this step.  CONTROL B now asserts c_min as well as c_max (a shrunk U
      # leaves the favourable reading at 1), and the identity check now
      # compares lambda_2^BK against its committed reference instead of
      # fetching it and discarding it (a rescaled BK step was invisible to
      # every other control).
      #
      # WIDENED after the mg-5ad1 audit (mg-75f0), because those two repairs were
      # derived FROM the two failures mg-09ea found and so closed two instances
      # rather than the class.  mg-5ad1 measured the residual -- the identity
      # check opened the committed mg-8b64 reference row and compared 4 of its 22
      # fields -- and beat the repaired gate with two more one-line mutations.
      # The identity check now recomputes the WHOLE row with mg-8b64's own row
      # builder and compares every field of it (22 of 22, one declared exclusion,
      # iterating the committed row so a field ADDED to it is compared
      # automatically); CONTROL E bounds dim U by its structural rank and
      # requires U to stay a PROPER subspace; CONTROL F gives the
      # reading-dependence check real-data coverage at enum-n7-#52/#88, whose
      # lambda_2 is degenerate, so the identity population is seven posets rather
      # than five.  The two repairs are demonstrated to FIRE by
      # scripts/onethird_mg60d3_gate_mutation_demo.py and the widening by
      # scripts/onethird_mg75f0_gate_class_closure_demo.py, NEITHER of which runs
      # here: between them they are twenty-four full runs of this step (~24 min),
      # far outside the order-seconds rule at the top of this file.
      #
      # They ARE run, automatically, by `.github/workflows/gate-mutation-demo.yml`
      # and -- blockingly, since the refinery does not read GitHub checks -- by
      # `scripts/refinery_gate.sh` (which runs the mg-60d3 demo blockingly and
      # leaves the mg-75f0 closure demo to Actions -- the blocking layer gets the
      # cheap total check, see that file's split).  Both are filtered to the paths
      # that can invalidate them, THIS FILE AMONG THEM, so an edit to the step
      # below re-runs the demonstrations against the edit.  This comment used to say
      # "run it on demand when the gate changes", which named no owner and no
      # mechanism; mg-5ad1 sec 4 established that four separate human steps
      # stood between a gate edit and the demo ever running again, and that
      # each of them fails silently.  mg-7db4 replaced the sentence with the
      # trigger it described.  See docs/OneThird-mg7db4-GateDemo-Trigger.md.
      - name: 'mg-2c34 SD-quant overlap controls (can the instrument fail?)'
        run: |
          pip install --quiet numpy
          python3 scripts/onethird_mg2c34_n7_overlap_test.py --no-sweep

      # mg-7db4: the trigger above has two copies of one paths list -- the one
      # in gate-mutation-demo.yml and the one in scripts/refinery_gate.sh --
      # because the visible copy and the blocking copy cannot share a file.
      # This step is why they cannot silently disagree, and why the list cannot
      # go stale against the corpus: it derives the transitive import closure
      # of everything the two jobs run and fails if the list has stopped
      # naming it.  Standard library only, no numpy, self-testing (five
      # synthetic drifts, each of which must be caught).  Order-milliseconds.
      - name: 'mg-7db4 watchlist consistency (is the trigger still complete?)'
        run: python3 scripts/onethird_mg7db4_watchlist_consistency.py

      # mg-5ad1 / mg-7db4: the STANDING BLINDNESS CHECK, and the reason it is
      # here rather than in the paths-filtered job.
      #
      # The mg-60d3 demonstration is a regression test on two known mutations
      # (M1, M2).  It answers "do the two repairs still fire?", not "is the
      # gate blind anywhere?", so scheduling it would have closed the
      # ownership gap and left the coverage gap open -- mg-5ad1 sec 4.  This
      # probe is the coverage half.  Part B IMPORTS THE GATE AND CALLS its own
      # `identity_field_comparisons` / `_identity_row_ok`, so there is no second
      # representation of the census left to drift from the first; Part C
      # compares the corpus's Theorem-E frozen-pair selector against the
      # committed reference, which is the quantity ledger claim 8 rests on.
      #
      # This comment said "Part B PARSES the gate's identity conjunction OUT OF
      # THE GATE SOURCE" and "...which the gate DOES NOT COMPARE" until mg-4f9b.
      # Both clauses were made false by mg-75f0, deliberately and as its own
      # headline -- and mg-75f0 edited this file without correcting the sentence
      # directly above the step it describes (mg-bd53 finding 5).  That is this
      # arc's named pattern one turn later: the over-wide statement lands in a
      # file's own description of its coverage, where nobody is watching.
      #
      # It is order-seconds -- the runtime objection that excluded the demo
      # does not apply -- so it runs on every commit, not only on gate edits.
      # That it can FAIL is not asserted here: it is demonstrated by
      # scripts/onethird_mg7db4_probe_mutation_battery.py in the paths-filtered
      # job, which also records what this probe is blind to (M4).
      - name: 'mg-5ad1 gate blindspot probe (is the gate blind anywhere?)'
        run: python3 scripts/onethird_mg5ad1_gate_blindspot_probe.py

      # mg-fccb: the inequality-direction check behind the §2.3 repair in
      # docs/OneThird-L1b-Spread-Locality.md.  Inequality direction is this
      # programme's recurring load-bearing failure -- mg-0ed7 §7.5 (caught by
      # mg-8f56) and mg-dbd1 §2.3 (caught by mg-d112) are the same defect twice
      # -- and both survived review because a reversed inequality type-checks.
      # This is the standing machine check for the one direction those repairs
      # rest on.
      #
      # POPULATION, corrected by mg-069f (mg-8a71 finding F2).  This comment used
      # to say the step sweeps "ALL posets on n = 3,4,5".  It does not: the
      # generator draws relations only from pairs (a,b) with a < b, so it sweeps
      # the 404 posets on n = 3,4,5 having the IDENTITY as a linear extension --
      # 6 385 (poset, reference-order) pairs, 31 625 element triples -- which is
      # 14.5% of the 4 469 labelled posets the old wording named (A001035:
      # 19, 219, 4231).  The verdict is unaffected and the true statement is the
      # stronger one: b_x and m_x are relabelling-invariant, so those 404 are a
      # complete set of representatives of (P, e) pairs up to isomorphism and the
      # sweep is exhaustive.  All three counts are now asserted in the script, so
      # a generator drifting off its stated family fails instead of silently
      # under-sweeping.  The all-labelled sweep is the next step.
      #
      # It asserts b_x <= m_x with zero exceptions, i.e. it actively hunts a
      # counterexample to the fix rather than confirming it on the witness that
      # motivated it.  It also pins the equality case at the e-minimum AND (added
      # mg-069f, finding F3) at the e-maximum, 6 385/6 385 each -- which is why
      # §3.1 remains VALID and must not be "corrected" alongside §2.3 (the trap in
      # that repair), and why its falsifier has a symmetric second instantiation.
      # Exact Fraction arithmetic, standard library only, no numpy, no sampling.
      # Runtime: 14.5 s measured on the fleet host -- this comment said "~8 s",
      # which mg-8a71 measured and mg-069f corrected.  Exits non-zero on any
      # assertion.
      - name: 'mg-fccb inequality-direction check (is b_x <= m_x, ever violated?)'
        run: python3 scripts/onethird_mgfccb_direction_check.py

      # mg-8a71 (independent audit of the mg-fccb repair): the same direction on
      # the genuinely all-labelled population -- 4 469 posets on n = 3,4,5,
      # 43 842 (poset, reference-order) pairs, 218 166 element triples.  This is
      # 6.9x the family the step above sweeps.  That gap is not a defect in the
      # step above (its family is a complete set of representatives up to
      # isomorphism, and b_x/m_x are relabelling-invariant) -- it was a defect in
      # how both were DESCRIBED, which mg-069f corrected at every site.  The step
      # is kept because the isomorphism argument that licenses the smaller family
      # is an argument, and this checks it against an enumeration.
      #
      # It also re-verifies the two identities the CORRECTED §2.3 sentence rests
      # on and that no direction check can see -- (F1) Sum_x m_x = 2E[inv_e] and
      # (star) E[Sum disp^2] = 2E[inv_e] + Cross -- exactly, where §4 of the
      # target doc reports (star) only to 1e-9.  Exact Fractions, stdlib only,
      # no sampling; ~25 s.  Exits non-zero on any assertion.
      - name: 'mg-8a71 direction re-check on ALL labelled posets + the identities under it'
        run: python3 scripts/onethird_mg8a71_audit_instrument.py

      # mg-8a71: a DOCUMENT-level control, because the numeric checks above
      # cannot see the defect they were written for.  That defect was never a
      # false number -- it was a false sentence in live body text, and mg-fccb's
      # own reason for striking it rather than annotating it was that an
      # annotation "left the wrong claim in the body".  This asserts the refuted
      # m_x-falsifier inference is not asserted in live body text of
      # docs/OneThird-L1b-Spread-Locality.md, where "live" excludes blockquotes
      # marked ~~struck~~ / ANNOTATION / RE-DERIVATION.
      #
      # BASELINE IS NOW EMPTY (mg-069f).  mg-8a71 recorded two sites as a named
      # baseline -- §3.2's "Equivalently" and §5 recommendation 2's converse,
      # both then unstruck (finding F1) -- and built the control to fail when a
      # baseline site DISAPPEARED, so that fixing F1 forced a re-baseline rather
      # than passing silently.  mg-069f struck both at the site, the control
      # failed as designed, and the baseline was reset to zero.  The control is
      # now a plain assertion: the refuted inference is asserted in live body
      # text NOWHERE in that document.
      #
      # mg-069f also tightened two things: an inline ~~struck~~ span inside a
      # plain paragraph counts as marked (needed to strike one sentence of a
      # numbered-list item), and a blockquote that merely DECLARES "STRUCK" is no
      # longer exempted on the strength of its label -- it is checked with the
      # inline strikes removed, so deleting the ~~ markup and keeping the label
      # now fails.  Only ANNOTATION / RE-DERIVATION blocks are exempt, because
      # commentary about a refuted claim must quote it.
      #
      # Exit codes, all measured, all predicted correctly before running:
      #   HEAD                                                        -> 0
      #   1b00147^  (pre-repair; §2.3's error live in the body)       -> 1
      #   1b00147   (mg-fccb HEAD; F1's two sites live)               -> 1
      #   HEAD with §3.2's ~~ deleted but "STRUCK" label kept         -> 1
      #   HEAD with §5 rec 2's ~~ deleted                             -> 1
      # Reproduce the first mutant-free one:
      #   git show 1b00147^:docs/OneThird-L1b-Spread-Locality.md > /tmp/pre.md
      #   python3 scripts/onethird_mg8a71_live_claim_control.py /tmp/pre.md  # -> 1
      - name: 'mg-8a71 live-claim control (is the refuted inference still asserted?)'
        run: python3 scripts/onethird_mg8a71_live_claim_control.py

      # mg-0242 (independent audit of the mg-069f closeout, bb1cb9b): three
      # instruments, each built for one half of the verdict this audit was given.
      #
      # (1) POPULATION CENSUS.  mg-8a71 finding F2 was found by reading a
      # helper's name; it would have been found sooner by calling the helper and
      # counting.  This step does that for every population the corpus's controls
      # NAME: it calls posets_with_identity_extension (404 / 6 385 / 31 625),
      # all_labelled_posets (4 469 / 43 842 / 218 166, per-n against A001035) and
      # the audit instrument's own generator, and checks the two all-labelled
      # generators are the same SET and not merely the same COUNT -- nobody had.
      # It exercises poset_family at a genuinely LABEL-DEPENDENT property ("is the
      # identity a linear extension of P": 100% on the small family by
      # construction, 9.0% on the labelled one) and confirms it sweeps all
      # labellings when told to and REFUSES (TypeError) when not told.
      #
      # It carries a BASELINE of two doc-level NAME-vs-COUNT gaps found by this
      # audit and left for pm-onethird: the closeout's §6.1 table says the
      # live-claim control sweeps "537/537 lines" (it sweeps 539), and the
      # direction check's docstring labels the 404 -> 4 469 POSET row "6.9x
      # larger" (it is 11.06x; 6.9x is the PAIR and TRIPLE ratio).  A baseline gap
      # closing fails the step, so repairing one forces a re-baseline.
      # Demonstrated against a commit where F2 is still present:
      #   python3 scripts/onethird_mg0242_population_census.py --demonstrate 2697c07
      #     -> all_posets(), docstring "All posets on n labelled elements", 404
      #        enumerated: an 11.06x gap, found by counting rather than reading.
      - name: 'mg-0242 population census (does every NAMED population equal the SWEPT one?)'
        run: python3 scripts/onethird_mg0242_population_census.py

      # (2) STRUCK vs REFUTED.  The mg-fccb -> mg-8a71 -> mg-069f arc proved ten
      # claims false; this ledger checks each against the repair's OWN live/marked
      # convention (the predicates are imported from the live-claim control, so
      # the standard applied is the one the repair set).  At HEAD: 10 refuted,
      # 8 removed from live body text, 2 live -- both baselined:
      #   C5  §5 rec 1's "This is the single pin", which mg-069f flagged and
      #       routed to pm-onethird rather than reversing mg-8a71's adjudication;
      #   C9  mgd112 §2.2's POPULATION CORRECTION block, which says a sentence
      #       "is struck with it" and does not strike it -- the exact hole
      #       mg-069f found by mutation and closed in the control, reappearing one
      #       document over in text mg-069f itself wrote.  Not flagged anywhere.
      # A third live site fails; a baseline site being struck also fails.
      # It also sweeps all 240 documents in docs/ with the same signatures (the
      # repair's control is one file, by design), and runs three mutants that
      # locate the remaining blind spot: a refuted sentence in the TAIL of an
      # ANNOTATION block is missed, while the same sentence as a paragraph or in
      # the tail of a STRIKE block is caught.  Demonstrated where F1 is present:
      #   python3 scripts/onethird_mg0242_struck_vs_refuted.py --tree 1b00147
      #     -> LIVE 7 at mg-fccb HEAD vs LIVE 2 here.
      - name: 'mg-0242 struck-vs-refuted ledger (is every refuted claim gone from the body?)'
        run: python3 scripts/onethird_mg0242_struck_vs_refuted.py

      # (3) IDENTITY RE-RUN.  A third implementation, sharing no line with the two
      # above, of everything the verdict said to preserve: (F1) Sum_x m_x =
      # 2E[inv_e] and (star) E[Sum disp^2] = 2E[inv_e] + Cross exact on all 43 842
      # (poset, reference-order) pairs -- (star) as the decomposition it factors
      # into, plus Cross recomputed from its own double sum on n = 3,4 -- the four
      # W_m closed forms, the ratio exactly 1/3, and Var(pos_sigma z) = m(m+2)/12.
      # That last one is the reason this step exists: mg-069f put it into LIVE
      # body text in the F5 restoration and no control asserts it anywhere.
      # ~25 s, exact rational arithmetic, stdlib only.
      - name: 'mg-0242 identity re-run (the checks no direction check can see)'
        run: python3 scripts/onethird_mg0242_identity_recheck.py
