name: Script controls

# Runs the fast, self-contained controls that guard the delta engine.
#
# WHY THE PATH FILTER IS WIDE (mg-4ad1): the only workflow in this repo used to
# be lean.yml, which filters on `lean/**`.  The last commit touching `lean/` was
# 2026-05-21, so from that date every commit -- all of them under `docs/`,
# `data/` and `scripts/` -- shipped with no automated coverage of any kind.  The
# mg-8489 gate control was in that window: present, correct, and never invoked.
# A control nothing runs is indistinguishable from a control that does not
# exist, so the filter here names the directories this repo actually commits to.
#
# WHAT MAY GO IN HERE: fast (order-seconds), self-contained, self-verifying
# scripts that already exit non-zero on failure.  The searches and the width-4
# arena counter must NOT be added -- the arena count alone is ~430 s at n = 10
# and the sweeps are far longer.  If a script has no fast self-check mode, leave
# it out rather than inventing one.

on:
  push:
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'docs/**'
      - '.github/workflows/script-controls.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'docs/**'
      - '.github/workflows/script-controls.yml'
  workflow_dispatch:

jobs:
  controls:
    runs-on: ubuntu-latest
    # PUT BACK TO 10 BY mg-75f0, whose reasoning the 10 -> 20 raise was carried
    # on.  mg-7db4 landed that raise here to avoid a conflict on this file and
    # was right to; the reasoning behind it was wrong, and correcting it is
    # mg-75f0's to do rather than mg-7db4's to inherit.
    #
    # The raise assumed the mg-5ad1 probe was expensive, on a 2m33s reading taken
    # while a multi-gate mutation demonstration was saturating the same host
    # (mg-1b8c: concurrent heavy jobs here inflate each other by roughly 10x).
    # Uncontended, measured on the fleet host: the probe is 26.5 s and the
    # mg-2c34 gate is 45 s; mg-7db4 measured this whole workflow going 41-64 s ->
    # 1m12s with both new steps on a hosted runner.  10 minutes was never close
    # to tight, and a bound loosened on a bad measurement is worse than one left
    # alone -- it stops being a wedge detector, which is the only thing a
    # timeout on an order-seconds job is for.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python version
        run: python3 --version

      # mg-3934, STATIC HALF ONLY, and the flag is the point.  This job's
      # checkout is depth 1 -- `actions/checkout`'s default, deliberate here,
      # and correct as long as nothing this job runs reads history.  That
      # condition is what `--static-only` checks: it derives the scripts each
      # workflow executes, their import closure, and which of those read a
      # pinned historical revision, then fails any workflow that reads one
      # without `fetch-depth: 0`.  It resolves nothing, so it is sound in a
      # shallow checkout; the resolvability half runs in gate-mutation-demo.yml,
      # where the history is actually fetched.
      #
      # It runs on EVERY commit under scripts/, data/ or docs/, and that is the
      # reason it is here and not only in the paths-filtered job: the defect it
      # is for -- mg-75f0's class-closure demo dead on arrival in CI for
      # 24 h 08 m 55 s (mg-a471; "21 hours" was the ticket's undercount, and
      # this is the fourth site it was left standing at)
      # because af7fc2df is not in a depth-1 clone -- was found by a red
      # run, and a second instance in a step that runs later would have been
      # just as invisible.  Order-milliseconds, standard library only,
      # self-testing (seven synthetic drifts, each of which must fire).
      - name: 'mg-3934 CI history-depth control (static half)'
        run: python3 scripts/onethird_mg3934_ci_history_depth_control.py --static-only

      # mg-a471: can a SUBSET run of the mg-75f0 class-closure demo be mistaken
      # for the demonstration?  That was mg-3946's F5 -- a `--only`/`--gates`
      # run overwrote the committed report with an unmarked partial one and
      # printed a ratio whose numerator was over the rows run and denominator
      # over the full set, exiting 0.  It bit that audit twice.
      #
      # It is HERE, in the order-seconds job, and not in the ~30-minute demo
      # workflow, because the repair lives entirely in the demo's driver --
      # which path it writes, which population each denominator is over, which
      # exit code it returns -- and none of that depends on what the gate
      # computes.  So this substitutes a fake `run_case` and drives the real
      # `main()`: no gate, no numpy, no network, 0.3 s.  A control that costs
      # sixteen gate runs is a control nobody runs, which is this arc's own
      # named failure mode.
      #
      # Self-testing: three drifts of its subject (the partial path re-pointed
      # at the canonical one, the denominators put back over the full set, the
      # subset exit code put back to 0), each of which must fire before the
      # real assertions are believed.
      - name: 'mg-a471 subset-run control (is a --only run mistakable for the demonstration?)'
        run: python3 scripts/onethird_mga471_partial_run_control.py

      # mg-8489: negative control for the fast_Q engine gate.  Corrupts fast_Q
      # three ways and Q_primary once, and requires five_engine_check to RAISE
      # on each; also requires it to stay green before and after patching.
      # ~1 s.  Exits non-zero if any of the 6 rows behaves wrongly.
      - name: 'mg-8489 fast_Q gate control (can the engine gate fail?)'
        run: python3 scripts/onethird_mg8489_fastq_gate_control.py

      # mg-8ff1: the n=9 witness that Lemma 3.2b's boxed "maps" hypothesis is
      # strictly weaker than the "swaps" its proof needs.  Re-derives |Aut(P)|,
      # e(P) and delta(P) rather than asserting them, so it also exercises
      # delta_of from the primitive delta search.  ~1 s.
      - name: 'mg-8ff1 Lemma 3.2b counterexample (n=9 witness)'
        run: python3 scripts/onethird_mg8ff1_lemma32b_counterexample.py

      # mg-2c34: the SD-quant overlap instrument and its four controls.  The
      # `--no-sweep` mode skips the 946-poset population sweep and runs only
      # the parts that can fail: CONTROL A (the instrument must reproduce a
      # known c = cos^2(theta), INCLUDING c = 0 -- an instrument that cannot
      # output 0 cannot refute SD-quant), CONTROL B/C (antichain c_max = c_min
      # = 1, and a deliberately broken projector must NOT return 1), CHECK-0
      # (agreement with mg-4a86's own instrument), and the identity check that
      # the three named posets still match their committed mg-8b64 rows.
      #
      # REPAIRED after the mg-09ea audit (mg-60d3): two mutations used to pass
      # this step.  CONTROL B now asserts c_min as well as c_max (a shrunk U
      # leaves the favourable reading at 1), and the identity check now
      # compares lambda_2^BK against its committed reference instead of
      # fetching it and discarding it (a rescaled BK step was invisible to
      # every other control).
      #
      # WIDENED after the mg-5ad1 audit (mg-75f0), because those two repairs were
      # derived FROM the two failures mg-09ea found and so closed two instances
      # rather than the class.  mg-5ad1 measured the residual -- the identity
      # check opened the committed mg-8b64 reference row and compared 4 of its 22
      # fields -- and beat the repaired gate with two more one-line mutations.
      # The identity check now recomputes the WHOLE row with mg-8b64's own row
      # builder and compares every field of it (22 of 22, one declared exclusion,
      # iterating the committed row so a field ADDED to it is compared
      # automatically); CONTROL E bounds dim U by its structural rank and
      # requires U to stay a PROPER subspace; CONTROL F gives the
      # reading-dependence check real-data coverage at enum-n7-#52/#88, whose
      # lambda_2 is degenerate, so the identity population is seven posets rather
      # than five.  The two repairs are demonstrated to FIRE by
      # scripts/onethird_mg60d3_gate_mutation_demo.py and the widening by
      # scripts/onethird_mg75f0_gate_class_closure_demo.py, NEITHER of which runs
      # here: between them they are twenty-four full runs of this step (~24 min),
      # far outside the order-seconds rule at the top of this file.
      #
      # They ARE run, automatically, by `.github/workflows/gate-mutation-demo.yml`
      # and -- blockingly, since the refinery does not read GitHub checks -- by
      # `scripts/refinery_gate.sh` (which runs the mg-60d3 demo blockingly and
      # leaves the mg-75f0 closure demo to Actions -- the blocking layer gets the
      # cheap total check, see that file's split).  Both are filtered to the paths
      # that can invalidate them, THIS FILE AMONG THEM, so an edit to the step
      # below re-runs the demonstrations against the edit.  This comment used to say
      # "run it on demand when the gate changes", which named no owner and no
      # mechanism; mg-5ad1 sec 4 established that four separate human steps
      # stood between a gate edit and the demo ever running again, and that
      # each of them fails silently.  mg-7db4 replaced the sentence with the
      # trigger it described.  See docs/OneThird-mg7db4-GateDemo-Trigger.md.
      - name: 'mg-2c34 SD-quant overlap controls (can the instrument fail?)'
        run: |
          pip install --quiet numpy
          python3 scripts/onethird_mg2c34_n7_overlap_test.py --no-sweep

      # mg-7db4: the trigger above has two copies of one paths list -- the one
      # in gate-mutation-demo.yml and the one in scripts/refinery_gate.sh --
      # because the visible copy and the blocking copy cannot share a file.
      # This step is why they cannot silently disagree, and why the list cannot
      # go stale against the corpus: it derives the transitive import closure
      # of everything the two jobs run and fails if the list has stopped
      # naming it.  Standard library only, no numpy, self-testing (five
      # synthetic drifts, each of which must be caught).  Order-milliseconds.
      - name: 'mg-7db4 watchlist consistency (is the trigger still complete?)'
        run: python3 scripts/onethird_mg7db4_watchlist_consistency.py

      # mg-856d: the step above checks that the watchlist covers what it claims
      # to cover.  This one checks the list that lets an entry of that watchlist
      # SKIP the blocking demonstration -- `DEMO_INSENSITIVE` in
      # scripts/refinery_gate.sh, which mg-856d introduced with one entry
      # (`.github/workflows/script-controls.yml`, THIS FILE) after measuring
      # that neither blocking instrument reads it.
      #
      # An exemption list on a gate is the cheapest possible way to build a
      # control that cannot fail: one appended line and the gate becomes a
      # `git diff` and a `grep` forever, with no visible change in any output.
      # So the list is checked rather than trusted -- an exempt path must stay
      # inside WATCHED, must not be a member of the derived import closure, must
      # not be one of the files the trigger's own decision is made of, must name
      # a catcher that is verified as actually wired into a workflow that
      # actually fires on it, and must leave the gate script and the demo itself
      # unexempted.  Five drifts, each of which must be caught, self-tested on
      # every run.  Standard library only, order-milliseconds.
      #
      # It runs here as well as in the blocking gate because THIS FILE is the
      # exempt path: an edit that removes the catcher this file provides should
      # not have to wait for someone to touch the gate script to be noticed.
      - name: 'mg-856d demo-exemption control (can the gate skip what it must not skip?)'
        run: python3 scripts/onethird_mg856d_exemption_control.py

      # mg-5ad1 / mg-7db4: the STANDING BLINDNESS CHECK, and the reason it is
      # here rather than in the paths-filtered job.
      #
      # The mg-60d3 demonstration is a regression test on two known mutations
      # (M1, M2).  It answers "do the two repairs still fire?", not "is the
      # gate blind anywhere?", so scheduling it would have closed the
      # ownership gap and left the coverage gap open -- mg-5ad1 sec 4.  This
      # probe is the coverage half.  Part B IMPORTS THE GATE AND CALLS its own
      # `identity_field_comparisons` / `_identity_row_ok`, so there is no second
      # representation of the census left to drift from the first; Part C
      # compares the corpus's Theorem-E frozen-pair selector against the
      # committed reference, which is the quantity ledger claim 8 rests on.
      #
      # This comment said "Part B PARSES the gate's identity conjunction OUT OF
      # THE GATE SOURCE" and "...which the gate DOES NOT COMPARE" until mg-4f9b.
      # Both clauses were made false by mg-75f0, deliberately and as its own
      # headline -- and mg-75f0 edited this file without correcting the sentence
      # directly above the step it describes (mg-bd53 finding 5).  That is this
      # arc's named pattern one turn later: the over-wide statement lands in a
      # file's own description of its coverage, where nobody is watching.
      #
      # It is order-seconds -- the runtime objection that excluded the demo
      # does not apply -- so it runs on every commit, not only on gate edits.
      # That it can FAIL is not asserted here: it is demonstrated by
      # scripts/onethird_mg7db4_probe_mutation_battery.py in the paths-filtered
      # job, which also records what this probe is blind to (M4).
      - name: 'mg-5ad1 gate blindspot probe (is the gate blind anywhere?)'
        run: python3 scripts/onethird_mg5ad1_gate_blindspot_probe.py

      # mg-fccb: the inequality-direction check behind the §2.3 repair in
      # docs/OneThird-L1b-Spread-Locality.md.  Inequality direction is this
      # programme's recurring load-bearing failure -- mg-0ed7 §7.5 (caught by
      # mg-8f56) and mg-dbd1 §2.3 (caught by mg-d112) are the same defect twice
      # -- and both survived review because a reversed inequality type-checks.
      # This is the standing machine check for the one direction those repairs
      # rest on.
      #
      # POPULATION, corrected by mg-069f (mg-8a71 finding F2).  This comment used
      # to say the step sweeps "ALL posets on n = 3,4,5".  It does not: the
      # generator draws relations only from pairs (a,b) with a < b, so it sweeps
      # the 404 posets on n = 3,4,5 having the IDENTITY as a linear extension --
      # 6 385 (poset, reference-order) pairs, 31 625 element triples -- which is
      # 14.5% of the 4 469 labelled posets the old wording named (A001035:
      # 19, 219, 4231).  The verdict is unaffected and the true statement is the
      # stronger one: b_x and m_x are relabelling-invariant, so those 404 are a
      # complete set of representatives of (P, e) pairs up to isomorphism and the
      # sweep is exhaustive.  All three counts are now asserted in the script, so
      # a generator drifting off its stated family fails instead of silently
      # under-sweeping.  The all-labelled sweep is the next step.
      #
      # It asserts b_x <= m_x with zero exceptions, i.e. it actively hunts a
      # counterexample to the fix rather than confirming it on the witness that
      # motivated it.  It also pins the equality case at the e-minimum AND (added
      # mg-069f, finding F3) at the e-maximum, 6 385/6 385 each -- which is why
      # §3.1 remains VALID and must not be "corrected" alongside §2.3 (the trap in
      # that repair), and why its falsifier has a symmetric second instantiation.
      # Exact Fraction arithmetic, standard library only, no numpy, no sampling.
      # Runtime: 14.5 s measured on the fleet host -- this comment said "~8 s",
      # which mg-8a71 measured and mg-069f corrected.  Exits non-zero on any
      # assertion.
      - name: 'mg-fccb inequality-direction check (is b_x <= m_x, ever violated?)'
        run: python3 scripts/onethird_mgfccb_direction_check.py

      # mg-8a71 (independent audit of the mg-fccb repair): the same direction on
      # the genuinely all-labelled population -- 4 469 posets on n = 3,4,5,
      # 43 842 (poset, reference-order) pairs, 218 166 element triples.  This is
      # 11.06x the family the step above sweeps in posets -- 6.87x in pairs and
      # 6.90x in triples, and mg-0242 G3 was one of those written on another's
      # row, so every ratio here names its grain.  That gap is not a defect in the
      # step above (its family is a complete set of representatives up to
      # isomorphism, and b_x/m_x are relabelling-invariant) -- it was a defect in
      # how both were DESCRIBED, which mg-069f corrected at every site.  The step
      # is kept because the isomorphism argument that licenses the smaller family
      # is an argument, and this checks it against an enumeration.
      #
      # It also re-verifies the two identities the CORRECTED §2.3 sentence rests
      # on and that no direction check can see -- (F1) Sum_x m_x = 2E[inv_e] and
      # (star) E[Sum disp^2] = 2E[inv_e] + Cross -- exactly, where §4 of the
      # target doc reports (star) only to 1e-9.  Exact Fractions, stdlib only,
      # no sampling; ~25 s.  Exits non-zero on any assertion.
      - name: 'mg-8a71 direction re-check on ALL labelled posets + the identities under it'
        run: python3 scripts/onethird_mg8a71_audit_instrument.py

      # mg-8a71: a DOCUMENT-level control, because the numeric checks above
      # cannot see the defect they were written for.  That defect was never a
      # false number -- it was a false sentence in live body text, and mg-fccb's
      # own reason for striking it rather than annotating it was that an
      # annotation "left the wrong claim in the body".  This asserts the refuted
      # m_x-falsifier inference is not asserted in live body text of
      # docs/OneThird-L1b-Spread-Locality.md, where "live" excludes blockquotes
      # marked ~~struck~~ / ANNOTATION / RE-DERIVATION.
      #
      # BASELINE IS NOW EMPTY (mg-069f).  mg-8a71 recorded two sites as a named
      # baseline -- §3.2's "Equivalently" and §5 recommendation 2's converse,
      # both then unstruck (finding F1) -- and built the control to fail when a
      # baseline site DISAPPEARED, so that fixing F1 forced a re-baseline rather
      # than passing silently.  mg-069f struck both at the site, the control
      # failed as designed, and the baseline was reset to zero.  The control is
      # now a plain assertion: the refuted inference is asserted in live body
      # text NOWHERE in that document.
      #
      # mg-069f also tightened two things: an inline ~~struck~~ span inside a
      # plain paragraph counts as marked (needed to strike one sentence of a
      # numbered-list item), and a blockquote that merely DECLARES "STRUCK" is no
      # longer exempted on the strength of its label -- it is checked with the
      # inline strikes removed, so deleting the ~~ markup and keeping the label
      # now fails.  Only ANNOTATION / RE-DERIVATION blocks are exempt, because
      # commentary about a refuted claim must quote it.
      #
      # mg-cd04 CLOSED mg-0242 FINDING G2: that tightening covered ONE of the two
      # marker classes.  An EXEMPT block was still skipped ENTIRELY on a label
      # read from its first three lines, with NO bound on how long the block ran --
      # the longest in this file runs 53 lines and swallowed the §2.3 population
      # correction mg-069f itself wrote.  An EXEMPT label now reaches only:
      #   * its own sub-paragraph, and only for MAX_LABEL_LINES (6) lines -- the
      #     one exemption still granted on a label's word, and now bounded; plus
      #   * each further sub-paragraph that carries a QUOTATION.  Commentary
      #     earns its exemption by quoting the claim it diagnoses; a
      #     sub-paragraph that quotes nothing is body text wearing a distant
      #     label, and is checked.
      # Effect on this file: exempt lines 147 -> 88, checked 319 -> 378, and the
      # ANNOTATION-tail mutant that mg-0242 demonstrated (exit 0, MISSED) is now
      # caught.  Same rule as the strike form -- BACK THE LABEL WITH MARKUP --
      # applied to the class it was missing.  NO new live sites at HEAD.
      #
      # Exit codes, all measured:
      #   HEAD                                                        -> 0
      #   1b00147^  (pre-repair; §2.3's error live in the body)       -> 1
      #   1b00147   (mg-fccb HEAD; F1's two sites live)               -> 1
      #   HEAD with §3.2's ~~ deleted but "STRUCK" label kept         -> 1
      #   HEAD with §5 rec 2's ~~ deleted                             -> 1
      #   HEAD with a refuted sentence in an ANNOTATION tail          -> 1  (was 0)
      # Reproduce the first mutant-free one:
      #   git show 1b00147^:docs/OneThird-L1b-Spread-Locality.md > /tmp/pre.md
      #   python3 scripts/onethird_mg8a71_live_claim_control.py /tmp/pre.md  # -> 1
      - name: 'mg-8a71 live-claim control (is the refuted inference still asserted?)'
        run: python3 scripts/onethird_mg8a71_live_claim_control.py

      # mg-cd04 (closes mg-0242 finding G1, at the site AND at the population).
      # mg-069f closed, by mutation, the hole where a block could exempt itself by
      # DECLARING a strike without the ~~ markup -- and in the SAME COMMIT wrote a
      # POPULATION CORRECTION block into mgd112 §2.2 that said a sentence "is
      # struck with it" and did not strike it.  One document over from where the
      # live-claim control looks, so no control could see it.  mg-cd04 added the
      # markup; this step is the other half -- the finding is really about the
      # POPULATION, and a control whose population stops at one document is the
      # same defect one level up.
      #
      # mg-0242 §8 measured the obvious generalisation and rejected it: running the
      # live-claim control's four SIGNATURES corpus-wide is ~94% false positive,
      # because audit documents discuss refuted claims in prose the convention
      # cannot mark.  What generalises is the STRUCTURE, not the content: "a
      # sentence that says text is struck must carry ~~" is claim-free, so quoting
      # a refuted sentence does not trip it.  Scoped to the SENTENCE, not the
      # block -- mg-8a71-VerdictRepairs §0 quotes a standard in one sentence and
      # reports strikes made elsewhere in the next, and that is a true report, not
      # a defect; it is printed as a NEAR MISS so the narrowing stays visible.
      #
      # 242 documents, 100 527 lines, every line classified and asserted to sum.
      # At HEAD: 2 hits, both baselined -- the mg-0242 report QUOTING the defect
      # it found, which is what an audit document is for.  A baseline site ceasing
      # to match also fails, so repairing one forces a re-baseline.
      # Demonstrated against the commit where G1 is present:
      #   python3 scripts/onethird_mgcd04_declared_strike_control.py --demonstrate bb1cb9b
      #     -> finds mgd112 §2.2, and nothing else in the 239 that tree holds.
      - name: 'mg-cd04 declared-strike control (does any document promise a strike it did not make?)'
        run: python3 scripts/onethird_mgcd04_declared_strike_control.py

      # mg-0242 (independent audit of the mg-069f closeout, bb1cb9b): three
      # instruments, each built for one half of the verdict this audit was given.
      #
      # (1) POPULATION CENSUS.  mg-8a71 finding F2 was found by reading a
      # helper's name; it would have been found sooner by calling the helper and
      # counting.  This step does that for every population the corpus's controls
      # NAME: it calls posets_with_identity_extension (404 / 6 385 / 31 625),
      # all_labelled_posets (4 469 / 43 842 / 218 166, per-n against A001035) and
      # the audit instrument's own generator, and checks the two all-labelled
      # generators are the same SET and not merely the same COUNT -- nobody had.
      # It exercises poset_family at a genuinely LABEL-DEPENDENT property ("is the
      # identity a linear extension of P": 100% on the small family by
      # construction, 9.0% on the labelled one) and confirms it sweeps all
      # labellings when told to and REFUSES (TypeError) when not told.
      #
      # Its BASELINE is EMPTY as of mg-1d03.  It carried two doc-level
      # NAME-vs-COUNT gaps -- mg-0242 finding G3 -- and mg-1d03 fixed both: the
      # closeout's §6.1 table said the live-claim control sweeps "537/537 lines"
      # (it sweeps 539), and the direction check's docstring labelled the
      # 404 -> 4 469 POSET row "6.9x larger" (it is 11.06x in posets; 6.9x is the
      # PAIR and TRIPLE ratio).  A baseline gap closing fails the step, so the
      # repair could not pass silently: it exited 1 with two BASELINE GAP CLOSED
      # lines until the entries were removed.
      # Demonstrated against a commit where F2 is still present:
      #   python3 scripts/onethird_mg0242_population_census.py --demonstrate 2697c07
      #     -> all_posets(), docstring "All posets on n labelled elements", 404
      #        enumerated: an 11.06x gap in posets, found by counting rather than
      #        reading.
      - name: 'mg-0242 population census (does every NAMED population equal the SWEPT one?)'
        run: python3 scripts/onethird_mg0242_population_census.py

      # (2) STRUCK vs REFUTED.  The mg-fccb -> mg-8a71 -> mg-069f arc proved ten
      # claims false; this ledger checks each against the repair's OWN live/marked
      # convention (the predicates are imported from the live-claim control, so
      # the standard applied is the one the repair set).  At HEAD: 10 refuted,
      # 9 removed from live body text, 1 live -- baselined:
      #   C5  §5 rec 1's "This is the single pin", which mg-069f flagged and
      #       routed to pm-onethird rather than reversing mg-8a71's adjudication.
      # RE-BASELINED by mg-cd04.  C9 -- mgd112 §2.2's POPULATION CORRECTION block,
      # which said a sentence "is struck with it" and did not strike it -- was the
      # second baselined site and mg-0242's finding G1.  mg-cd04 added the markup,
      # the "baseline site disappeared" gate fired exactly as built, and C9 is
      # removed from the baseline rather than left to pass silently.
      # A second live site fails; a baseline site being struck also fails.
      # It also sweeps all 242 documents in docs/ with the same signatures (the
      # repair's control is one file, by design), and runs three mutants which are
      # now an ASSERTION rather than a report: all three must exit 1.  M1 (a
      # refuted sentence in the TAIL of an ANNOTATION block) was mg-0242's finding
      # G2 and exited 0; mg-cd04 closed it, and M1 returning to 0 now fails this
      # step as a G2 regression.  Demonstrated where F1 is present:
      #   python3 scripts/onethird_mg0242_struck_vs_refuted.py --tree 1b00147
      #     -> LIVE 8 at mg-fccb HEAD vs LIVE 1 here, ITEMISED claim by claim.
      # (mg-0242 read that number as 7.  It was 7 under the un-bounded exemption:
      # C7, the "over all posets on n = 3,4,5" population claim mg-8a71 F2 proved
      # false, sat in the Machine-checked sub-paragraph of the 53-line
      # RE-DERIVATION block, quoting nothing, inside the G2 blind spot.  With the
      # exemption bounded the same ledger sees it.  The drift reading -- the
      # repair working -- holds and is now computed rather than narrated.)
      - name: 'mg-0242 struck-vs-refuted ledger (is every refuted claim gone from the body?)'
        run: python3 scripts/onethird_mg0242_struck_vs_refuted.py

      # (3) IDENTITY RE-RUN.  A third implementation, sharing no line with the two
      # above, of everything the verdict said to preserve: (F1) Sum_x m_x =
      # 2E[inv_e] and (star) E[Sum disp^2] = 2E[inv_e] + Cross exact on all 43 842
      # (poset, reference-order) pairs -- (star) as the decomposition it factors
      # into, plus Cross recomputed from its own double sum on n = 3,4 -- the four
      # W_m closed forms, the ratio exactly 1/3, and Var(pos_sigma z) = m(m+2)/12.
      # That last one is the reason this step exists: mg-069f put it into LIVE
      # body text in the F5 restoration and no control asserts it anywhere.
      # ~25 s, exact rational arithmetic, stdlib only.
      - name: 'mg-0242 identity re-run (the checks no direction check can see)'
        run: python3 scripts/onethird_mg0242_identity_recheck.py

      # mg-9a19 (INDEPENDENT AUDIT of the mg-cd04 repair above).  The two controls
      # before this one assert that a refuted claim is NOT live and that a declared
      # strike IS made.  Neither can say anything about what they do not look at,
      # and every finding in this arc has come from exactly there.  This step
      # records the RESIDUAL -- the reach of every exemption channel, and the exit
      # code of seven mutants aimed at the boundary mg-cd04 drew rather than at the
      # one it removed.
      #
      # RE-RECORDED ONCE, BY mg-9d7b.  M4 and M8 below moved 0 -> 1 when mg-9d7b
      # bounded the two channels that were letting them through.  The values are
      # what this step asserts TODAY; the mg-9a19 readings are kept beside them,
      # because a table whose whole purpose is that a residual cannot move
      # quietly must not lose the movement when it is written down.
      #
      #   M4  refuted sentence appended to a QUOTATION-BACKED EXEMPT sub-paragraph
      #       -> 1, caught (was 0, MISSED, at mg-9a19).  mg-cd04 bounded the
      #       LABEL's sub-paragraph at MAX_LABEL_LINES = 6 and left every
      #       quotation-backed sub-paragraph exempt at any length; mg-9d7b bounds
      #       it at MAX_QUOTED_LINES = 11, the measured reach with no headroom.
      #       A cap of 12 would NOT have closed it -- M4 appends exactly one line.
      #   M5/M6/M7  the label bound probed from both sides -> 0, 0, 1.  The bound
      #       is enforced EXACTLY at 6 lines.  (`MAX_EXEMPT_LINES`, which this
      #       control's docstring named twice from mg-cd04 to mg-9d7b while no
      #       such identifier existed anywhere in the repository, now exists and
      #       bounds a block's exempt text at 27 lines.)
      #   M8  a declared strike under an UNCLOSED fence -> 1, caught (was 0).  The
      #       fence skip ran to EOF; mg-9d7b stopped treating an unclosed fence as
      #       a fence, so the marker line is checked and the site is named.
      #   M9  a declared strike in a block holding an unrelated ~~ span -> 0, still
      #       missed.  The DECLARATION test is per sentence; the BACKING test is
      #       per block.  mg-9d7b left this OPEN and made it REPORTED -- the
      #       control now prints every sentence exempted this way (1 at HEAD, the
      #       mg-9a19 audit quoting the rule).  Failing on it would buy a
      #       permanent tolerance to close a LOW finding.
      #   M10 the bare defect -> 1, so M8 and M9 are about the exemption.
      #
      # This step FAILS IF A RECORDED OUTCOME MOVES IN EITHER DIRECTION.  A mutant
      # that starts being caught is a repair and a mutant that stops being caught
      # is a regression, and neither may land silently -- the convention mg-8a71
      # set for its baseline, applied to a mutant table.  It also asserts its own
      # population (every *.md in the working tree lands in exactly one bucket)
      # and sweeps the 24 documents the declared-strike control's non-recursive
      # glob does not reach: 0 hits there, so the gap is coverage, not a defect.
      # No revision is named in code; the ledger re-derivation is behind
      #   python3 scripts/onethird_mg9a19_exemption_population_audit.py --drift 1b00147 bb1cb9b
      # which classifies the ledger's ten claims at three trees under BOTH the
      # pre- and post-G2 classifiers, and confirms 7->8 at 1b00147 is the
      # classifier (C7) while 2->1 at HEAD is the text (C9).
      - name: 'mg-9a19 exemption/population audit (how far does each exemption still reach?)'
        run: python3 scripts/onethird_mg9a19_exemption_population_audit.py

      # mg-9d7b — THE CHANNEL CENSUS.  The step above measures how far each KNOWN
      # exemption reaches.  This one asserts that the SET of them is complete and
      # that none is invisible:
      #
      #     every route by which a line leaves a control unchecked is either
      #     BOUNDED by a named constant, or REPORTED with a number in that
      #     control's own output.  Unbounded-and-reported is a decision.
      #     Bounded-and-quiet is fine.  UNBOUNDED AND SILENT is the defect.
      #
      # It exists because mg-cd04 bounded ONE channel of two and mg-9a19 found the
      # other still open and carrying MORE lines (66 against 59) -- and because
      # the control mg-cd04 wrote to close that finding reintroduced the same
      # shape in its own fence skip.  Repairing the next field and leaving the set
      # is what this arc keeps doing; the invariant is the repair for the class.
      #
      # It is deliberately NOT a table of channels copied out of two docstrings,
      # which would pass exactly when its author's reading was complete -- the
      # thing in question.  Both halves are mechanical:
      #   * it fails on a COVERAGE BUCKET it was never told about, which is what a
      #     new exemption channel looks like from outside the control;
      #   * it fails when the lines in a non-checking bucket are not claimed, TO
      #     THE LINE, by a declared channel;
      #   * it fails when a channel declared BOUNDED names an identifier the
      #     module does not define -- exactly the `MAX_EXEMPT_LINES` defect;
      #   * it captures each control's real STDOUT and fails when an unbounded
      #     channel's reach appears nowhere in it.
      #
      # Can it fail?  Both answers are executable and neither is asserted in prose:
      #   python3 scripts/onethird_mg9d7b_exemption_channel_census.py --selftest
      #     -> builds four broken controls, one per half; 4 of 4 rejected.
      #   python3 scripts/onethird_mg9d7b_exemption_channel_census.py --demonstrate 1e996fb
      #     -> loads BOTH controls from the parent tree and finds 9 violations
      #        there, including the two the ticket names.  0 here.
      # 15 channels are declared across the two controls; the two that remain
      # unbounded (closed fences at 4.30% of the corpus, and the inline ~~ strip)
      # are unbounded BY DESIGN and print their own numbers.
      - name: 'mg-9d7b exemption-channel census (is any exemption unbounded AND silent?)'
        run: |
          python3 scripts/onethird_mg9d7b_exemption_channel_census.py --selftest
          python3 scripts/onethird_mg9d7b_exemption_channel_census.py

      # mg-77e6 — THE INDEPENDENT AUDIT OF THE STEP ABOVE.  The census asserts
      # that no DECLARED channel is unbounded and silent.  mg-9d7b's E13 asked a
      # different question -- would it find a channel its author had NOT declared
      # -- recorded the answer as MISSED, and read that as a complete reading.
      #
      # A negative needs an instrument that could have shown the positive, so this
      # step BUILDS SIXTEENTH CHANNELS: real edits to real controls, run through
      # the census's own unmodified observe() and audit().  Measured:
      #
      #   CAUGHT  a new coverage bucket that today's corpus exercises (X4)
      #   CAUGHT  lines in `exempt_annotation` no declared channel claims (X5)
      #   MISSED  text deleted from inside a checked unit -- A5's own class (X1)
      #   MISSED  a skip folded into the existing `blank` bucket (X2)
      #   MISSED  whole documents dropped from the population (X3)
      #   MISSED  a new bucket keyed on a marker today's corpus never triggers (X6)
      #
      # X1 and X2 are shown to be REAL routes out: a planted claim that trips
      # S2-hinges-on-degree under the pristine control scores 0 under the mutant.
      # And deleting each of the census's own 15 rows in turn shows it would
      # re-discover 4 of them (A1, A2, A4, B1) -- not A5 and not A8, the two
      # mg-9d7b reports as discoveries.  So the census is a REGRESSION TEST on a
      # declared enumeration, which is real and useful, and is not the discovery
      # instrument E13 was a prediction about.
      #
      # This step FAILS IF A RECORDED OUTCOME MOVES IN EITHER DIRECTION.  Widening
      # the census SHOULD move them; re-record RECORDED in the probe, in the
      # commit that widens it, with the old values kept visible.
      - name: 'mg-77e6 sixteenth-channel probe (can the census DISCOVER a channel, or only check one?)'
        run: python3 scripts/onethird_mg77e6_sixteenth_channel_probe.py

      # (mg-1d03) mg-0242 G3 — THE TWO MIS-STATED TABLES, ROW BY ROW.  G3 was two
      # named-vs-counted gaps that the mg-069f REPAIR introduced, one of them
      # inside the very table whose purpose is to report named-vs-swept: the
      # closeout's §6.1 said the live-claim control sweeps "537/537 lines" (539),
      # and the direction check's docstring labelled the 404 -> 4 469 POSET row
      # "6.9x larger" (11.06x in posets; 6.9x is the PAIR ratio 6.87x and the
      # TRIPLE ratio 6.90x -- a real number from an adjacent GRAIN, which is why
      # it read as plausible).  mg-0242's instruction was not "fix the two
      # figures": a table that got its own row wrong has not earned trust on its
      # neighbours, so check the rest by CALLING the helper.
      #
      # This step does exactly that, and no figure in it is a literal copied from
      # the table it audits:
      #   * it PARSES the three rows of §6.1 out of the closeout and matches every
      #     integer against a fresh enumeration -- rows 1 and 2 were correct, 0
      #     gaps in 6 figures, and that is now asserted rather than believed;
      #   * it PARSES the 4 x 2 docstring table and recomputes the ratio label,
      #     which must carry its GRAIN;
      #   * it sweeps docs/, scripts/ and .github/ for every family-ratio literal
      #     and fails any ASSERTION that omits its grain or is wrong at it.  15
      #     sites beyond the one baselined figure said "6.9x" with no grain or
      #     the wrong one; all are corrected.  This comment is inside that
      #     population and was caught by it while being written.  Two structural
      #     classes are listed and
      #     never failed on -- a literal in backticks or a quoted span (a
      #     quotation is not an assertion), and a line carrying BOTH figures (a
      #     report OF the defect).  Both are printed line by line, because
      #     "exempt and silent" is the failure this corpus keeps finding in
      #     itself.
      - name: 'mg-1d03 table-row audit (does every ROW equal what the helper returns?)'
        run: python3 scripts/onethird_mg1d03_table_row_audit.py

      # (mg-1d03) mg-0242 G4 — FIVE REMEDIATION INSTRUMENTS, ONE STANDARD.  The
      # arc removed ten refuted claims from live body text five different ways --
      # strike-at-site x4, rewrite-in-place x2, rewrite + annotation x2, a
      # DELETION declared as a strike x1, none x1 -- and named only
      # strike-at-site.  G4 is a finding about a MISSING STANDARD, not about five
      # mistakes: a worker who rewrote in place was not violating a rule, the
      # rule did not cover what they did.
      #
      # The standard now lives in this script: which instrument is preferred and
      # WHY, when each of the other four is acceptable, and which one a control
      # can see.  The last column is the load-bearing one, so it is MEASURED, not
      # asserted -- 7 mutants x 2 controls = 14 exit codes, one refuted claim
      # (ledger C3) remediated each way in a scratch corpus:
      #   I1 strike-at-site, I2 rewrite-in-place, I3 rewrite + annotation and
      #   I4 an UNDECLARED DELETION -> 0/0.  All four are pairwise
      #      indistinguishable to both controls.
      #   I5a a declared deletion quoting a short form -> 0/1, caught by the
      #      declared-strike control: the ONE boundary CI can see.
      #   I5b the same declaration quoting the sentence verbatim -> 1/1.  The
      #      quotation itself reads as a live assertion, which refuted mg-1d03's
      #      own prediction P8 in its unrestricted form.
      #   I6 the claim RESTORED LIVE -> 1/0, the positive control.  Without it the
      #      six rows of zeros would measure nothing.
      # It also asserts the live-claim control STATES that reach where it reports
      # (its output named the word "instrument" 0 times before mg-1d03), so a
      # green run can no longer be read as "no unremediated claims".
      - name: 'mg-1d03 remediation instruments (which of the five can any control see?)'
        run: python3 scripts/onethird_mg1d03_remediation_instruments.py

      # (mg-5854) INDEPENDENT AUDIT of the mg-1d03 G3+G4 repair.  Not a re-run of
      # the two steps above -- both pass, and were re-run.  This asks the two
      # questions an audit of them has to ask and that they cannot ask of
      # themselves.
      #
      # (1) The row audit above obtains every figure by CALLING the helper.  If
      #     the HELPER were wrong the table and the audit would agree and both be
      #     wrong, and if the audit's ROW SELECTOR is narrower than the table a
      #     row can be present and unchecked.  So this counts the same six
      #     populations from an enumerator that shares no line with either helper
      #     -- brute force over all 2^(n(n-1)) relations on [n], tested for the
      #     three axioms directly -- and checks the A001035 literals as a third
      #     leg.  All six agree.  Rows are then matched PER COLUMN (§6.1's columns
      #     ARE `population NAMED` and `population SWEPT`; a rule that pools them
      #     cannot see what the table exists to report) and every data row must be
      #     known: rows PRESENT and rows CHECKED are printed as two numbers.
      #     Measured: the row audit above exits 0 on a column-swap mutant and on a
      #     fourth row naming no script.  Both are coverage, not wrong answers.
      #
      # (2) The instruments matrix above measures 7 mutants at ONE site -- ledger
      #     C3, in the one document the live-claim control reads.  4 of the
      #     ledger's 10 entries do not live there.  This remediates a claim by all
      #     five instruments at two sites in mgd112, against THREE controls
      #     (adding the struck-vs-refuted ledger, whose part B sweeps all of
      #     docs/): 2 subjects x 7 mutants x 3 controls = 42 exit codes.  Result:
      #     for a claim the ledger does not name, LEAVING IT LIVE is
      #     indistinguishable from striking it at the site -- 2 exit-code classes,
      #     not 4 -- and the ledger's corpus sweep SEES it (21 -> 22 hits) and
      #     exits 0 anyway.
      #
      # BASELINE: 1 entry, and it is a finding.  §6.1 row 3 and the live-claim
      # control's own report say "539 lines"; the document has 538 (`wc -l`).
      # 539 is the `split("\n")` fragment count, whose last element is the empty
      # string after the trailing newline.  Coverage is unaffected -- 539 is a
      # superset -- but the GRAIN of the label is wrong by one unit, in the SWEPT
      # column of the table whose purpose is to report named-vs-swept, one row
      # below where mg-0242 G3 was found.  Routed to pm-onethird rather than
      # repaired: an audit that edits its subject destroys the record.  A
      # baselined gap that CLOSES fails this step, so the fix forces a
      # re-baseline.  Report: docs/OneThird-mg5854-G3G4-IndependentAudit.md.
      # `--vs-parent` materialises a tree and is OFF the default path (mg-3934):
      # this job checks out at depth 1 by design.
      - name: 'mg-5854 independent audit (do the rows survive a second enumerator, and what does the control miss?)'
        run: python3 scripts/onethird_mg5854_row_and_instrument_audit.py
