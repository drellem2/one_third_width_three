name: Script controls

# Runs the fast, self-contained controls that guard the delta engine.
#
# WHY THE PATH FILTER IS WIDE (mg-4ad1): the only workflow in this repo used to
# be lean.yml, which filters on `lean/**`.  The last commit touching `lean/` was
# 2026-05-21, so from that date every commit -- all of them under `docs/`,
# `data/` and `scripts/` -- shipped with no automated coverage of any kind.  The
# mg-8489 gate control was in that window: present, correct, and never invoked.
# A control nothing runs is indistinguishable from a control that does not
# exist, so the filter here names the directories this repo actually commits to.
#
# WHAT MAY GO IN HERE: fast (order-seconds), self-contained, self-verifying
# scripts that already exit non-zero on failure.  The searches and the width-4
# arena counter must NOT be added -- the arena count alone is ~430 s at n = 10
# and the sweeps are far longer.  If a script has no fast self-check mode, leave
# it out rather than inventing one.

on:
  push:
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'docs/**'
      - '.github/workflows/script-controls.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'docs/**'
      - '.github/workflows/script-controls.yml'
  workflow_dispatch:

jobs:
  controls:
    runs-on: ubuntu-latest
    # mg-75f0 raised this to 20 and then put it back, which is worth one line of
    # explanation rather than a silent revert.  The raise assumed the mg-5ad1
    # probe was expensive, on a 2m33s measurement taken while a 25-minute
    # mutation demonstration was saturating the same host.  Uncontended it is
    # 30.8 s here, and mg-7db4 measured this whole workflow going 41-64 s ->
    # 1m12s with both new steps on a hosted runner.  10 minutes was never close
    # to tight, and a bound loosened on a bad measurement is worse than one
    # left alone: it stops being a wedge detector.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python version
        run: python3 --version

      # mg-8489: negative control for the fast_Q engine gate.  Corrupts fast_Q
      # three ways and Q_primary once, and requires five_engine_check to RAISE
      # on each; also requires it to stay green before and after patching.
      # ~1 s.  Exits non-zero if any of the 6 rows behaves wrongly.
      - name: 'mg-8489 fast_Q gate control (can the engine gate fail?)'
        run: python3 scripts/onethird_mg8489_fastq_gate_control.py

      # mg-8ff1: the n=9 witness that Lemma 3.2b's boxed "maps" hypothesis is
      # strictly weaker than the "swaps" its proof needs.  Re-derives |Aut(P)|,
      # e(P) and delta(P) rather than asserting them, so it also exercises
      # delta_of from the primitive delta search.  ~1 s.
      - name: 'mg-8ff1 Lemma 3.2b counterexample (n=9 witness)'
        run: python3 scripts/onethird_mg8ff1_lemma32b_counterexample.py

      # mg-2c34: the SD-quant overlap instrument and its four controls.  The
      # `--no-sweep` mode skips the 946-poset population sweep and runs only
      # the parts that can fail: CONTROL A (the instrument must reproduce a
      # known c = cos^2(theta), INCLUDING c = 0 -- an instrument that cannot
      # output 0 cannot refute SD-quant), CONTROL B/C (antichain c_max = c_min
      # = 1, and a deliberately broken projector must NOT return 1), CHECK-0
      # (agreement with mg-4a86's own instrument), and the identity check that
      # the three named posets still match their committed mg-8b64 rows.
      #
      # REPAIRED after the mg-09ea audit (mg-60d3): two mutations used to pass
      # this step.  CONTROL B now asserts c_min as well as c_max (a shrunk U
      # leaves the favourable reading at 1), and the identity check now
      # compares lambda_2^BK against its committed reference instead of
      # fetching it and discarding it (a rescaled BK step was invisible to
      # every other control).
      #
      # WIDENED after the mg-5ad1 audit (mg-75f0): the repairs above were
      # derived FROM the two failures mg-09ea found, so they closed two
      # instances and not the class.  mg-5ad1 measured the residual -- the
      # identity check opened the committed mg-8b64 reference row and compared
      # 4 of its 22 fields -- and beat the repaired gate with two more one-line
      # mutations.  The identity check now compares the WHOLE reference row (22
      # of 22, one declared exclusion), and CONTROL E / CONTROL F were added.
      #
      # The full source-level mutation demonstrations are NOT run here:
      # onethird_mg60d3_gate_mutation_demo.py is six runs of this step (~12
      # min) and onethird_mg75f0_gate_class_closure_demo.py is fourteen (~35
      # min), both far outside the order-seconds rule at the top of this file.
      # What IS run here is the next step, which is the part of them that is
      # fast enough -- see there for why that is not the same as "on demand".
      - name: 'mg-2c34 SD-quant overlap controls (can the instrument fail?)'
        run: |
          pip install --quiet numpy
          python3 scripts/onethird_mg2c34_n7_overlap_test.py --no-sweep

      # mg-75f0 (wiring in the mg-5ad1 audit probe): the standing control on the
      # step above.  mg-5ad1 finding 2 was that the gate's proof-of-firing has no
      # owner and no mechanism -- "run it on demand when the gate changes" names
      # no person and no trigger, and a control that has stopped being able to
      # fire prints nothing and exits 0, which is indistinguishable from a
      # control that fired.  This step is the mechanism, and it is cheap enough
      # to be one.  It checks:
      #
      #   A  the mg-60d3 F4 repair is sound in BOTH directions on A_4/A_5/A_6 --
      #      non-vacuous (dim_E = n-1 > 1), true to < 1e-12 against a 1e-8
      #      assertion, and not knife-edge in the degeneracy tolerance.  Rebuilt
      #      from definitions, importing nothing from the corpus.
      #   B  every field of the committed mg-8b64 reference row is either
      #      COMPARED by the gate or excluded with a stated reason (22 + 1 of
      #      23); perturbing ANY of the 22 makes the gate's own predicate fail;
      #      and a field newly ADDED to the reference row is picked up
      #      automatically.  This part takes the census FROM THE GATE ITSELF --
      #      it calls the gate's comparison function rather than keeping a list.
      #      A hand-maintained census goes wrong, silently, the first time
      #      someone adds a field, which is this same defect one turn later.
      #   C  the argmin-ratio frozen-pair selector still reproduces the
      #      committed frozen_pair at 5/5 posets, and flipping it still moves
      #      the pair at 5/5 -- so mg-5ad1's M3 remains a real mutation and the
      #      comparison that catches it remains available.
      #   D  every gate predicate (CONTROL B, E, F) is handed a row it must
      #      accept and a row it must REJECT.
      #
      # 30.8 s uncontended on the fleet host; mg-7db4 measured ~30 s on a
      # hosted runner.  Exits non-zero on any failure.
      - name: 'mg-5ad1 gate blindspot probe (is the gate above still able to fail?)'
        run: python3 scripts/onethird_mg5ad1_gate_blindspot_probe.py
