name: Gate mutation demo

# THE POSITIVE CONTROL FOR THE CONTROL GATE (mg-7db4).
#
# `script-controls.yml` decides whether the delta-engine controls pass.  This
# workflow decides whether those controls can still FAIL.  It runs
# `scripts/onethird_mg60d3_gate_mutation_demo.py`, which mutates the gated
# instrument two ways and asserts the 2x3 exit-code matrix -- both mutations
# fatal under the repaired gate, neither fatal under the pre-repair gate, and
# no false positive on the unmutated instrument.
#
# WHY IT IS NOT IN script-controls.yml.  It is six full runs of that gate,
# ~11 min locally, against the order-seconds rule stated at the top of that
# file.  That rule is real and this workflow does not violate it: the paths
# filter below means an ordinary commit -- a doc, a data drop, a new probe --
# never pays for this job at all.  Only commits that can break it pay.
#
# WHAT THIS REPLACES.  The gate comment used to say "run it on demand when the
# gate changes."  The mg-5ad1 audit (docs/OneThird-mg60d3-GateRepair-Independent
# Audit.md, sec 4) established that this had no owner and no mechanism: four
# things had to happen, all human, all silent on failure.  The paths filter
# below IS the trigger the sentence named -- the same event, expressed as
# something that cannot forget.
#
# ENFORCEMENT IS NOT HERE.  This repo has no branch protection and its merges
# are performed by the pogo refinery, which fast-forwards to main without
# consulting GitHub Actions.  A green or red check here therefore INFORMS but
# does not BLOCK.  The blocking copy of this same paths filter lives in
# `scripts/refinery_gate.sh`, wired in by `.pogo/refinery.toml`, and the two
# lists are kept in step by `scripts/onethird_mg7db4_watchlist_consistency.py`,
# which runs in the order-seconds gate.  See docs/OneThird-mg7db4-GateDemo-
# Trigger.md.
#
# RED IS TOLERATED HERE, AND WHO SEES IT (mg-3934).  The sentence above was
# true and incomplete, and the gap cost 24 h 08 m 55 s -- twelve consecutive
# red runs, 2026-07-30T05:36:59Z to 2026-07-31T05:45:54Z, five of them on
# `main`; the "21 hours" this line used to say was the ticket's undercount,
# which the mg-3934 doc corrected and this comment did not (mg-3946), and the
# "24 h 09 m" that replaced it was that window rounded to the minute while
# "~24 hours" went on standing in the doc (mg-a471).  Nothing consumed
# this workflow's result, so a step that had NEVER ONCE run was
# indistinguishable from a step that was running and passing.  A
# permanently-red informational check is worse than no check -- it trains
# every reader to skip the column.
#
# Making it block was considered and rejected on the same measured grounds
# mg-7db4 and mg-75f0 used to keep the expensive demonstrations out of the
# refinery gate: this job is ~30 min, and a blocking gate long enough that
# people want it bypassed outlives nothing.  So red stays tolerated, and the
# fix is a CONSUMER rather than a policy:
#
#   * `scripts/refinery_gate.sh` reads this workflow's latest conclusion on
#     `main` and prints it in the refinery's Gate Output, which `pogo refinery
#     show` displays to the author of every gate-touching merge.  It is
#     non-blocking by construction and cannot fail a merge -- see the READOUT
#     section of that file.  That is the audience: the people whose commits
#     can invalidate these demonstrations, at the moment they merge one.
#     mg-3946 measured that audience and it is smaller than that sentence:
#     the polecat merge protocol reads `pogo refinery show <id> --json | jq -r
#     .status` and no other field, pogod reaps the author seconds after the
#     merge lands, and nothing else here or on the fleet reads an Actions
#     result.  A human running `pogo refinery show` by hand is the whole of
#     it.  mg-3946 also found the readout reporting an IN-PROGRESS run as red
#     -- on its first live firing -- and repaired that.
#   * The mg-3934 preflight below turns THIS class of red -- a step that cannot
#     run in the environment it is run in -- into a named, seconds-long failure
#     at the top of the job instead of a ten-minute one at the bottom.
#
# What is still not claimed: nobody is paged. The readout makes red visible to
# a reader who is already looking at a merge; it does not make anyone look.
#
# WHAT THE LIST BELOW IS.  The gate, the demo, the gated instrument, the
# transitive closure of the corpus modules that instrument imports, and the one
# committed dataset its identity check reads.  It is NOT "every control script
# in script-controls.yml": the demo exercises the mg-2c34 step only, so the
# mg-8489 and mg-8ff1 scripts are deliberately absent -- each carries its own
# negative control and a change to either cannot alter what this demo asserts.
# Editing script-controls.yml itself is watched, so adding a step is covered.
#
# WHAT THE DEMO DOES NOT DO, and why this job has a second step.  The demo
# answers "do the two known repairs still fire?", not "is the gate blind
# anywhere?".  Its EXPECTED matrix is hardcoded over {none, M1, M2}, so mg-5ad1
# is right that scheduling it alone would leave the coverage gap open.  The
# standing blindness check is `onethird_mg5ad1_gate_blindspot_probe.py`, which
# is fast enough to live in script-controls.yml and does; the second step here
# is the battery that proves that probe can actually FAIL, and records the
# mutations nothing catches.  Neither instrument subsumes the other -- the
# battery's N3 and N5 rows are mutations only the demo sees, and its M3 row is
# a mutation only the probe sees.
#
# WHAT mg-75f0 CLOSED, and what it did not.  This header used to say the gate's
# identity conjunction compared 4 of the committed reference row's 22 fields and
# that M4 was caught by nothing in the repo.  Both were true and both have
# changed: the identity check now compares the whole row (22 of 22, one declared
# exclusion) and the gate's CONTROL E catches M4.  The third step below is the
# demonstration, including on five mutations neither mg-60d3 nor mg-5ad1 used.
#
# STILL OPEN, so a green run here is not read as more than it is.  The widening
# gates on the fields of the COMMITTED mg-8b64 row; a quantity the corpus computes
# and never commits still has no reference to be compared against, and this
# mechanism cannot manufacture one.  And the standing probe remains blind to M4
# specifically (the gate is not) -- recorded in the battery's expected-exit table
# and in docs/OneThird-mg7db4-GateDemo-Trigger.md.  See
# docs/OneThird-mg75f0-GateClassClosure.md sec on the residual.
#
# HOW TO READ THE FIRST GREEN AFTER 2026-07-31 (mg-3934).  The mg-75f0 step had
# never executed in CI: it was added on 2026-07-30 and died on `invalid object
# name af7fc2df` on that run and on all eleven after it -- twelve red runs, the
# step reached on eleven and skipped on the twelfth (mg-3946 corrects the
# "eight" this line used to say) -- because it resolves a historical commit
# and `actions/checkout` had not been asked for one.  The three steps before
# it did run and did pass throughout -- re-verified by mg-3946 against run
# 30606216109, where steps 5-7 are `success` and only step 8 is `failure` --
# so what was lost is narrower than "the positive control is dead": it is
# exactly the question
# "does the widening catch mutations nobody enumerated?", which had no CI
# evidence at all.  Its first green is therefore its FIRST EXECUTION and is new
# information, not a restoration.  See docs/OneThird-mg3934-CI-HistoryDepth.md.

on:
  push:
    paths:
      - '.github/workflows/gate-mutation-demo.yml'
      - '.github/workflows/script-controls.yml'
      - '.pogo/refinery.toml'
      - 'scripts/refinery_gate.sh'
      - 'scripts/onethird_mg3934_ci_history_depth_control.py'
      - 'scripts/onethird_mg7db4_watchlist_consistency.py'
      - 'scripts/onethird_mg856d_exemption_control.py'
      - 'scripts/onethird_mg7db4_probe_mutation_battery.py'
      - 'scripts/onethird_mg5ad1_gate_blindspot_probe.py'
      - 'scripts/onethird_mg60d3_gate_mutation_demo.py'
      - 'scripts/onethird_mg75f0_gate_class_closure_demo.py'
      - 'scripts/onethird_mg2c34_n7_overlap_test.py'
      - 'scripts/onethird_mg4a86_sdquant_overlap.py'
      - 'scripts/onethird_mg4a86_sector_leakage_and_tempering.py'
      - 'scripts/onethird_mg4a86_standard_dominance_target_audit.py'
      - 'scripts/onethird_mg8b64_L1b_bk_transport_transfer_probe.py'
      - 'scripts/onethird_mgb0a6_spectral_killshot_probe.py'
      - 'data/onethird-mg8b64-L1b-bk-transport-transfer.json'
  pull_request:
    paths:
      - '.github/workflows/gate-mutation-demo.yml'
      - '.github/workflows/script-controls.yml'
      - '.pogo/refinery.toml'
      - 'scripts/refinery_gate.sh'
      - 'scripts/onethird_mg3934_ci_history_depth_control.py'
      - 'scripts/onethird_mg7db4_watchlist_consistency.py'
      - 'scripts/onethird_mg856d_exemption_control.py'
      - 'scripts/onethird_mg7db4_probe_mutation_battery.py'
      - 'scripts/onethird_mg5ad1_gate_blindspot_probe.py'
      - 'scripts/onethird_mg60d3_gate_mutation_demo.py'
      - 'scripts/onethird_mg75f0_gate_class_closure_demo.py'
      - 'scripts/onethird_mg2c34_n7_overlap_test.py'
      - 'scripts/onethird_mg4a86_sdquant_overlap.py'
      - 'scripts/onethird_mg4a86_sector_leakage_and_tempering.py'
      - 'scripts/onethird_mg4a86_standard_dominance_target_audit.py'
      - 'scripts/onethird_mg8b64_L1b_bk_transport_transfer_probe.py'
      - 'scripts/onethird_mgb0a6_spectral_killshot_probe.py'
      - 'data/onethird-mg8b64-L1b-bk-transport-transfer.json'
  workflow_dispatch:

jobs:
  mutation-demo:
    runs-on: ubuntu-latest
    # Three demonstrations: six --no-sweep gate runs (~11 min), ten probe runs
    # (~5 min), and sixteen more gate runs (~13 min) -- about 30 min on the
    # fleet host.  Raised 45 -> 75 by mg-75f0 when it added the third step, in
    # the same commit, so the bound tracks the work rather than lagging it.  The
    # bound is generous because a hosted runner is slower and a timeout here
    # reads as "the demonstrations could not be shown to fire", which is the
    # failure this job exists to make impossible to miss.
    timeout-minutes: 75
    steps:
      # fetch-depth: 0 IS LOAD-BEARING (mg-3934).  The mg-75f0 step below
      # resolves a pinned historical commit -- `git show af7fc2df:<gate>` -- to
      # build its pre-widening column.  `actions/checkout` defaults to depth 1,
      # so from the day that step was added until 2026-07-31 it died on
      # `invalid object name` before doing anything, on every run, and the
      # demonstration it performs had never once executed in CI.  The code was
      # correct; the environment was not the one it was verified in.
      #
      # The cost is nothing to speak of: the whole history is 2.6 MiB packed
      # over ~380 commits, and the checkout step measured 1 s at depth 1.
      #
      # The preflight step below is what stops this being fixed once and
      # regressing quietly -- it derives which workflows run history-reading
      # code and fails any that has not deepened its checkout.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numpy
        run: pip install --quiet numpy

      # FIRST, and it is the cheapest thing in the file: every pinned revision
      # any script in the corpus reads must resolve in THIS checkout, and every
      # workflow that runs history-reading code must have deepened its
      # checkout.  Order-milliseconds, standard library only.
      #
      # It runs here, ahead of the ~30 minutes below, because the failure it
      # catches is one the demonstrations cannot distinguish from their own:
      # `cannot read <gate> at <rev>` looked exactly like a demo failure for
      # 24 h 08 m 55 s.  Named at the top of the job it is unmistakable.
      # ("21 hours" here is the same undercount the header above corrects; it
      # survived at this second site inside the very file that fixed the first,
      # which is F4's whole shape -- mg-a471.)
      # mg-76d0 found this site and its twin in script-controls.yml
      # independently, auditing 9072f34 as merged, and landed on the same two
      # corrections mg-a75e rescued here.  Worth keeping: both wrap the phrase
      # across a comment continuation -- `for 21` ends a line, `# hours` begins
      # the next -- so `grep -rn "21 hours"` returns NEITHER.  A sweep for a
      # stale figure in a hard-wrapped corpus must flatten the continuations
      # first, or its "no sites left" means "none left ON ONE LINE".
      - name: 'mg-3934 CI history-depth control (can the pinned revs be read here?)'
        run: python3 scripts/onethird_mg3934_ci_history_depth_control.py

      # Cheap and first: if the two copies of the paths list have drifted, or
      # if the gated instrument has grown an import nobody added to them, say
      # so in seconds rather than after the 11-minute demo.
      - name: 'mg-7db4 watchlist consistency (is the trigger still complete?)'
        run: python3 scripts/onethird_mg7db4_watchlist_consistency.py

      # The cheaper of the two demonstrations, so it runs first: eight probe
      # runs against eight one-line mutations, asserting which the standing
      # blindness check catches AND which it is blind to.  ~6 min.
      - name: 'mg-7db4 probe mutation battery (can the standing check fail?)'
        run: python3 scripts/onethird_mg7db4_probe_mutation_battery.py

      - name: 'mg-60d3 gate mutation demo (do the F3/F4 repairs still fire?)'
        run: python3 scripts/onethird_mg60d3_gate_mutation_demo.py

      # THE THIRD DEMONSTRATION, added by mg-75f0 -- the slot above this comment
      # was reserved for it and the four edits it required were all made
      # together: this step, the path in BOTH `paths:` lists above, the same path
      # in `scripts/refinery_gate.sh`, and the script's name in `ROOTS` in
      # `scripts/onethird_mg7db4_watchlist_consistency.py`.  The last one is
      # enforced rather than optional: a watched path reachable from nothing in
      # `ROOTS` is rejected as "watched but not part of the gate", which is the
      # mechanism refusing to let a demonstration be wired into a job without
      # also being watched, and refusing the converse too.
      #
      # WHAT IT ANSWERS that the two steps above do not.  The demo above asks
      # "do the two known repairs still fire?" and the battery asks "can the
      # standing probe fail?".  Both are regression tests over mutations their
      # authors already knew about.  This one asks whether the widened identity
      # check catches mutations NOBODY had used against it: five of its seven
      # rows were used by neither mg-60d3 nor mg-5ad1, and one of those five was
      # authored by mg-7db4 for a different purpose, so it is the only row not
      # chosen by whoever built the thing under test.  It also measures, per
      # row, whether the pre-widening gate COMPUTED the moved quantity and
      # absorbed it or never reached the mutated code at all -- two findings of
      # different strength that an exit code alone averages together.
      #
      # ~13 min, sixteen full --no-sweep gate runs (8 cases x 2 columns; this
      # said "eighteen" until mg-76d0 counted it against the report).  It is
      # here and not in
      # script-controls.yml for the same reason as the two above: the
      # order-seconds rule at the top of that file is real, and the paths filter
      # means an ordinary commit never pays for this job.
      - name: 'mg-75f0 gate class-closure demo (does the widening catch UNSEEN mutations?)'
        run: python3 scripts/onethird_mg75f0_gate_class_closure_demo.py

      # All three write their reports before exiting non-zero, so a failing run
      # is the one where this matters most.
      - name: Upload the demonstration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-mutation-demo-report
          path: |
            data/onethird-mg60d3-gate-mutation-demo.json
            data/onethird-mg7db4-probe-mutation-battery.json
            data/onethird-mg75f0-gate-class-closure.json
          if-no-files-found: warn
